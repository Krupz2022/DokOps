name: broker-dropping-messages-oblique-phrasing
# KNOWN FAILING / DELIBERATELY DEFERRED — see evals/scenarios/README.md. The
# query names no engine while must_call_any below demands one specific
# engine (rabbitmq_*), and must_not_call forbids the ordinary discovery
# tools a genuinely ambiguous complaint should be allowed to reach for. The
# routing gap this scenario was meant to test — does the model fall back to
# Kubernetes tools when a non-Kubernetes system is misdescribed — is already
# covered deterministically by backend/tests/test_tool_discovery_pointer.py.
known_failing: true
# Deliberately does NOT say "rabbitmq", "queue", "vhost", "amqp", "exchange"
# or "binding" -- none of AIService._SERVICE_TOOL_MAP's rabbitmq_ keywords.
# Same 78fb39f regression as database_slow_oblique_phrasing.yaml: "the
# broker is dropping messages" is exactly how a client phrases this, and the
# keyword gate that selects rabbitmq_* tools AND includes the SERVICE TOOL
# RULE fragment never fires on it. Before the always-on TOOL DISCOVERY RULE
# pointer (backend/app/prompts/dokops.md, `base` section), the model had no
# rabbitmq_* tools and no instruction that they exist, and fell back to
# Kubernetes tools. This scenario fails without the pointer.
#
# Also avoids every DIAGNOSE RULE trigger phrase ("what's wrong", "not
# working", "failing", "broken", "investigate", "issue", "error", "crash",
# "debug", "troubleshoot", "why", "check") so this scenario tests only the
# tool-discovery pointer, not the separate always-on diagnose sweep.
#
# "orders" names the workload the broker serves (matches the orders.process
# / orders.dlx queues in the fixtures below) without naming "queue" itself
# (a _SERVICE_TOOL_MAP keyword) or the engine -- a real complaint always
# carries some identifying context, and a query with none is genuinely
# ambiguous rather than testing oblique phrasing.
query: "the broker handling orders is dropping messages"
cluster:
  # Real rabbitmq_dead_letter_queues (app/tools/rabbitmq_tools.py:154-170)
  # returns {"success": True, "data": <plain formatted table string or the
  # literal "No dead-letter queues configured." when none exist>, "error":
  # None, "source": "rabbitmq"} via the shared _fmt() helper
  # (rabbitmq_tools.py:83-92). Columns are exactly name, vhost, messages,
  # dlx, dlrk -- the tool reports a message COUNT sitting in the DLX, never
  # a cause (no "consumer crashed" or "TTL expired" text -- that inference
  # is the model's job, not the fixture's).
  rabbitmq_dead_letter_queues:
    success: true
    data: |
      name             vhost  messages  dlx          dlrk
      ---------------  -----  --------  -----------  --------------
      orders.process   /      1842      orders.dlx   orders.failed

      (1 row)
  # Real rabbitmq_list_queues (rabbitmq_tools.py:112-127) -- same envelope;
  # columns name, vhost, messages, ready, unacked, consumers, state,
  # publish/s, built straight from the RabbitMQ management API's /queues
  # response (message_stats/publish_details/rate), never anything richer.
  rabbitmq_list_queues:
    success: true
    data: |
      name             vhost  messages  ready  unacked  consumers  state    publish/s
      ---------------  -----  --------  -----  -------  ---------  -------  ---------
      orders.process   /      312       298    14       2          running  45.2
      orders.dlx       /      1842      1842   0        0          running  12.8

      (2 rows)
  # Real rabbitmq_node_health (rabbitmq_tools.py:210-230) returns a plain
  # joined-lines string ("\n".join(lines)), not a table -- left generic and
  # healthy so it cannot itself explain the drop; the DLX/queue fixtures
  # above are where the real evidence lives.
  rabbitmq_node_health:
    success: true
    data: "Node: rabbit@broker-1\nStatus: running\nMemory: 1.2 GB / 4.0 GB\nDisk free: 42.1 GB\nAlarms: none"
expect:
  # This is the real assertion: did the agent reach the actual broker tools
  # instead of substituting Kubernetes tools for a non-Kubernetes system --
  # mirrors redis_uses_redis_tools.yaml's must_call_any pattern.
  must_call_any: [rabbitmq_list_queues, rabbitmq_dead_letter_queues, rabbitmq_node_health]
  # AIService._CORE_K8S (app/services/ai_service.py) is always in the tool
  # schema regardless of routing, so every name in it is reachable even for
  # a pure broker question -- and evals/defaults.py was reverted in ad5f91a,
  # so calling one IS punished again: _fixture_server (harness.py) now
  # returns an explicit miss, {"success": False, "error": "eval: no fixture
  # for '<tool>' in scenario '<name>'"}, for anything this scenario doesn't
  # fixture. must_call_any/must_not_call below are graded on what the model
  # actually called regardless of what that call returned, so this doesn't
  # change the assertions -- it only means a Kubernetes tool the model
  # reaches for gets a fake-looking error back, not a plausible one.
  #
  # search_topology and list_services are deliberately NOT forbidden here
  # (removed from the full _CORE_K8S list this used to be). The query names
  # a workload ("orders") but not which broker/system owns it, and using
  # search_topology or list_services to work out what "orders" actually is
  # before picking a tool family is defensible discovery for a vague query --
  # forbidding it punished correct behaviour as hard as the old fixture-miss
  # error did. The rest of _CORE_K8S has no such excuse: search_pods,
  # get_pod_logs, describe_pod, diagnose_pod/service, scale_deployment, etc.
  # are all ways of investigating this as a Kubernetes workload problem
  # instead of a broker problem, which is exactly the wrong-tool-routing
  # regression this scenario exists to catch.
  must_not_call:
    - get_cluster_health
    - search_pods
    - get_pod_logs
    - get_pod_events
    - describe_pod
    - get_node_status
    - list_namespaces
    - diagnose_pod
    - diagnose_service
    - scale_deployment
    - deploy_application
    - create_namespace
    - get_endpoints
    - list_deployments
    - fix_image_pull
  must_not_end_on_question: true
