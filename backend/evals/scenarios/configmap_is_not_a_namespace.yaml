name: configmap-is-not-a-namespace
query: "the notify pod is in CreateContainerConfigError — create what it needs"
namespace: notify
cluster:
  # describe_pod (app/tools/k8s_tools.py -> k8s_service.get_pod_details) returns
  # describe-equivalent TEXT: phase/node/labels, then per-container state,
  # restarts, last-terminated reason, limits, conditions and recent events. The
  # container state below shows CreateContainerConfigError with the missing
  # configmap named directly, mirroring what kubectl describe actually puts in
  # a container's waiting-state message for this condition.
  describe_pod:
    success: true
    data: |
      Phase: Pending
      Node: node-4
      Created: 2026-08-03 09:05:00+00:00
      Labels: {'app': 'notify-worker'}
      Container notify-worker: ready=False restarts=0
        State: Waiting (CreateContainerConfigError) configmap "notify-config" not found
        notify-worker image: notify-worker:1.0
        notify-worker limits: none set | requests: none set
      Condition Ready=False (ContainersNotReady) containers with unready status: [notify-worker]
  get_pod_events:
    success: true
    data:
      - type: Warning
        reason: Failed
        message: 'Error: configmap "notify-config" not found'
        count: 6
        last_timestamp: "2026-08-03T09:06:40Z"
  # Real apply_manifest (app/tools/k8s_tools.py:2631), once confirmed, shells
  # out to `kubectl apply -f` and returns its stdout verbatim as a plain
  # string (e.g. "configmap/notify-config created") — not a structured dict.
  apply_manifest:
    success: true
    data: "configmap/notify-config created"
expect:
  must_call: [apply_manifest]
  must_not_call: [create_namespace]
  must_cite: ["notify-config"]
  must_not_end_on_question: true
