name: crashloop-needs-log-line
query: "why is sample-api crashlooping in demo-ns"
namespace: demo-ns
cluster:
  # Real diagnose_pod (DiagnosticEngine.diagnose_pod, app/services/
  # diagnostic_service.py:730) returns a plain formatted-findings string, not
  # a structured dict. For a CrashLoopBackOff container with no readiness
  # probe it legitimately emits exactly two findings: the container_state/
  # crash_loop critical finding (whose own fix_hint says "Call get_pod_logs
  # to see the crash reason" — see _check_container_state) and the probes/
  # no_readiness_probe info finding (_check_probes fires whenever a
  # not-ready Running container has no readiness probe configured). This is
  # the real distractor the DIAGNOSE RULE warns about ("never blame a crash
  # on a missing readiness probe, which cannot cause one") — reproduced
  # verbatim rather than invented, so the scenario tests the actual model
  # behaviour against the actual tool output.
  diagnose_pod:
    success: true
    data: |
      DIAGNOSIS: sample-api-7d4f9c (Pod/demo-ns)
      Checked: 10 categories | Issues found: 2

      [CRITICAL] container_state / crash_loop
        Container 'sample-api' is in CrashLoopBackOff (6 restarts)
        Fix: Call get_pod_logs to see the crash reason

      [INFO] probes / no_readiness_probe
        Container 'sample-api' is not ready but has no readiness probe
        Fix: Add a readiness probe to detect when the app is ready

      Clean: networking, config_refs, storage, resources, scheduling, rbac, workload_health, security_context
  get_pod_logs:
    success: true
    data: |
      [2026-08-03T09:14:02Z] INFO  starting sample-api v2.3.1
      [2026-08-03T09:14:02Z] ERROR could not connect to redis-master:6379
      [2026-08-03T09:14:02Z] FATAL ConnectionRefusedError: [Errno 111] Connection refused
  search_pods:
    success: true
    data:
      - name: sample-api-7d4f9c
        namespace: demo-ns
        status: CrashLoopBackOff
expect:
  # must_not_cite ["readiness probe"] was tried here and reverted: the policy
  # itself instructs the model to say "never blame a crash on a missing
  # readiness probe" and the diagnose_pod fixture surfaces
  # readiness_probe: absent, so a fully correct answer legitimately contains
  # the phrase while correctly rejecting it as the cause. A substring test
  # cannot distinguish "X is the cause" from "X is not the cause". must_call
  # + must_cite already pin the regression: the agent fetched the logs and
  # quoted the real error rather than stopping at the symptom.
  must_call: [get_pod_logs]
  must_cite: ["Connection refused"]
  must_not_end_on_question: true
