name: redis-uses-redis-tools
query: "redis memory usage looks high, what is filling it"
cluster:
  # Real redis_info / redis_keyspace_stats (app/tools/redis_tools.py:82,112)
  # both return a plain formatted string, not a dict — and redis_info only
  # ever includes the specific keys listed in its `sections` map (server/
  # memory/clients/persistence/replication/stats). "evicted_keys" is not one
  # of them; the real tool cannot report it, so it must not appear here.
  # used_memory_human sitting close to maxmemory_human is the real signal for
  # "memory usage looks high".
  redis_info:
    success: true
    data: |
      [server]
        redis_version: 7.2.4
        uptime_in_seconds: 8823410
        config_file: /etc/redis/redis.conf
      [memory]
        used_memory_human: 3.81G
        used_memory_peak_human: 3.95G
        maxmemory_human: 4.00G
        mem_fragmentation_ratio: 1.02
      [clients]
        connected_clients: 214
        blocked_clients: 0
        maxclients: 10000
      [persistence]
        rdb_last_save_time: 1785734400
        rdb_changes_since_last_save: 18234
        aof_enabled: 0
      [replication]
        role: master
        connected_slaves: 1
        master_replid: 9f3a2b1c8e7d6f5a4b3c2d1e0f9a8b7c6d5e4f3a
      [stats]
        total_commands_processed: 918234512
        instantaneous_ops_per_sec: 4213
        keyspace_hits: 812734021
        keyspace_misses: 19234123
  redis_keyspace_stats:
    success: true
    data: "db0: keys=8817234, expires=12, avg_ttl=0ms"
expect:
  must_call_any: [redis_info, redis_keyspace_stats]
  # AIService._CORE_K8S (app/services/ai_service.py) is always added to the
  # tool schema, including on the is_service path — so every name in it is
  # reachable by the model even for a pure Redis question. Forbid all of it,
  # not just the four tools an earlier version of this scenario happened to
  # guess; a narrower list would let the reported wrong-tool-routing bug
  # (e.g. diagnose_pod called for a Redis question) pass silently.
  #
  # _CORE_K8S lists 23 names, but _select_dynamic_tools filters it against the
  # real registry schema (`t["function"]["name"] in AIService._CORE_K8S`), so
  # only names that also exist in the registry are ever actually added to the
  # model's tool list. As of this writing 9 of the 23 (get_deployments,
  # get_nodes, get_services, get_namespaces, get_configmaps,
  # get_secrets_names, delete_pod, get_pod_details, get_ingresses) do not
  # exist in the registry and are therefore dead entries — never reachable,
  # so listing them here would only break Step 8's tool-name validation for
  # no protective effect. This is the full set that IS reachable; if any of
  # the dead names above get a real implementation added under that exact
  # name, add it here too.
  must_not_call:
    - get_cluster_health
    - search_pods
    - get_pod_logs
    - get_pod_events
    - describe_pod
    - diagnose_pod
    - diagnose_service
    - search_topology
    - scale_deployment
    - deploy_application
    - create_namespace
    - list_services
    - get_endpoints
    - list_deployments
  must_not_end_on_question: true
