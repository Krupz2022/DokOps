name: service-zero-endpoints
query: "investigate the checkout namespace, something seems broken"
namespace: checkout
# `presweep:` below is what app/services/presweep.py's build_presweep() actually
# emits for this exact scenario, not an empty string. Production runs
# _zero_endpoint_services() (presweep.py:226-258) on every namespace
# investigation, deterministically, before the model gets a turn: it finds
# checkout-web with 0 ready endpoints, reads the Service's own selector
# (app=checkout-webb, from get_resource_yaml below) and the pod labels
# actually present in the namespace (app=checkout-web, from describe_pod
# below), and hands both to the model as verified fact. append_missing_findings
# (presweep.py:104-176) then mechanically appends this finding to the drafted
# answer if the model's own answer failed to cover it.
#
# An empty presweep here (the scenario's original state) tested the agent
# with a safety net production always provides removed -- passing this
# scenario meant the model derived the selector mismatch entirely on its own
# from list_services/get_endpoints/get_resource_yaml, which is strictly
# harder than what production ever asks of it. With the real presweep
# present, this scenario instead verifies what production actually
# guarantees: that the deterministic finding (the selector value, via
# must_cite) reaches the final answer, whether the model quotes it directly
# or append_missing_findings backstops it. Do not revert this to `presweep: ""`
# -- that reintroduces the exact gap this scenario was rewritten to close.
presweep: |
  PRE-FLIGHT SWEEP of namespace 'checkout' — verified facts, already gathered for you. Do not re-fetch these with tools.
  This is a HEAD START, NOT the scope of your investigation. It covers only service endpoints, deployment readiness, ReplicaSet failures and crash logs. Quote these facts directly — they are the answer, not a hint. The user asked about a SPECIFIC resource — answer about that resource. Other findings below are namespace context: mention them in at most one short 'other issues in checkout' note, without their log excerpts.
  Services with NO ready endpoints (broken even if their pods are Running):
    - checkout-web: 0 endpoints. selector={app=checkout-webb}
    pod labels present in this namespace: app=checkout-web
cluster:
  # The query's wording ("something seems broken") hits the always-on DIAGNOSE
  # RULE, which requires diagnose_pod or diagnose_service to be called FIRST,
  # before anything else. Without these fixtures the model's first tool call
  # returns "eval: no fixture for 'diagnose_pod'", derailing the run for a
  # reason unrelated to what this scenario tests.
  #
  # Both fixtures mirror the real diagnostic_engine output shape exactly (a
  # plain formatted string — see DiagnosticEngine._format_findings /
  # diagnose_pod / diagnose_service in app/services/diagnostic_service.py),
  # not a structured dict. diagnose_service's real no_ready_endpoints Finding
  # only ever reads "Service '<name>' has 0 ready endpoints — all traffic
  # will fail" — it does not inspect or name the selector (that check lives
  # entirely in _check_networking, which only runs against a Service's own
  # matching pods, and none match here). Naming "checkout-webb" in this
  # fixture would hand the model the answer before it does the selector/label
  # comparison the regression is about, so it deliberately stays generic.
  diagnose_pod:
    success: true
    data: |
      DIAGNOSIS: checkout-web-5f8b (Pod/checkout)
      Checked: 10 categories | Issues found: 0
      Clean: container_state, probes, networking, config_refs, storage, resources, scheduling, rbac, workload_health, security_context
  diagnose_service:
    success: true
    data: |
      DIAGNOSIS: checkout-web (Service/checkout)
      Checked: 1 categories | Issues found: 1

      [CRITICAL] networking / no_ready_endpoints
        Service 'checkout-web' has 0 ready endpoints — all traffic will fail
        Fix: Check pod readiness and service selector
  search_pods:
    success: true
    data:
      - name: checkout-web-5f8b
        namespace: checkout
        status: Running
  # Real list_services (app/tools/k8s_tools.py:992) wraps results in
  # {"services": [...], "total": N} and never includes a selector field at
  # all — kubectl-style selector info simply is not part of that tool's
  # payload. The Service's selector value ("checkout-webb") therefore must
  # not appear here; it belongs only in get_resource_yaml below, where a real
  # `kubectl get service -o yaml` would actually show it.
  list_services:
    success: true
    data:
      services:
        - name: checkout-web
          namespace: checkout
          type: ClusterIP
          cluster_ip: 10.96.44.10
          ports: "http:80/TCP"
      total: 1
  get_endpoints:
    success: true
    data:
      name: checkout-web
      namespace: checkout
      subsets: []
      total_ready: 0
      total_not_ready: 0
  # Real list_deployments (app/tools/k8s_tools.py:2274) wraps results in
  # {"deployments": [...], "count": N} with fields replicas/ready_replicas/
  # available_replicas/updated_replicas — not desired/ready.
  list_deployments:
    success: true
    data:
      deployments:
        - name: checkout-web
          namespace: checkout
          replicas: 1
          ready_replicas: 1
          available_replicas: 1
          updated_replicas: 1
      count: 1
  # describe_pod (app/tools/k8s_tools.py -> k8s_service.get_pod_details) returns
  # describe-equivalent TEXT: phase/node/labels, then per-container state,
  # restarts, last-terminated reason, limits, conditions and recent events.
  # This is still the real tool's only source for the pod's labels.
  describe_pod:
    success: true
    data: |
      Phase: Running
      Node: node-7
      Created: 2026-08-01 10:15:00+00:00
      Labels: {'app': 'checkout-web'}
      Container checkout-web: ready=True restarts=0
        State: Running since 2026-08-01 10:15:30+00:00
        checkout-web image: checkout-web:2.1
        checkout-web limits: {'memory': '512Mi'} | requests: {'memory': '256Mi'}
      Condition Ready=True
  # get_resource_yaml (app/tools/k8s_tools.py:2301) is a thin wrapper over
  # `kubectl get <kind> <name> -o yaml` and returns plain YAML text. This is
  # the one fixture where the Service's selector legitimately belongs — a
  # real `kubectl get service checkout-web -o yaml` genuinely shows it.
  get_resource_yaml:
    success: true
    data: |
      apiVersion: v1
      kind: Service
      metadata:
        name: checkout-web
        namespace: checkout
      spec:
        selector:
          app: checkout-webb
        type: ClusterIP
        ports:
          - port: 80
            protocol: TCP
expect:
  # must_cite is the assertion this scenario is actually about post-fix: does
  # the selector value production's own presweep already computed reach the
  # final answer (directly or via append_missing_findings' backstop).
  must_cite: ["checkout-webb"]
  # Deliberately NO must_call here. presweep above already supplies the
  # selector/endpoint evidence and says so explicitly ("Quote these facts
  # directly — they are the answer, not a hint" / "Do not re-fetch these with
  # tools"). Requiring list_services/get_endpoints would fail an agent for
  # correctly obeying that instruction instead of redundantly re-fetching data
  # it was already handed -- a guaranteed false-fail, not a real assertion.
  # The evidence path production actually guarantees is presweep ->
  # append_missing_findings -> the answer, which must_cite checks. Do not add
  # a must_call for these tools back.
  must_not_end_on_question: true
