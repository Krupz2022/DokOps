apiVersion: v1
kind: Namespace
metadata:
  name: dokops-chaos
---
# 1. ImagePullBackOff — tag does not exist
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  namespace: dokops-chaos
spec:
  replicas: 1
  selector:
    matchLabels: {app: sample-api}
  template:
    metadata:
      labels: {app: sample-api}
    spec:
      containers:
      - name: app
        image: nginx:1.99-doesnotexist
---
# 2. CrashLoopBackOff — exits 1 with a plausible app error on stderr
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: dokops-chaos
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-worker}
  template:
    metadata:
      labels: {app: order-worker}
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        command: ["/bin/sh","-c"]
        args:
          - 'echo "FATAL: could not connect to postgres at db.internal:5432: connection refused" >&2; sleep 2; exit 1'
---
# 3. CreateContainerConfigError — references a ConfigMap key that doesn't exist
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-svc
  namespace: dokops-chaos
spec:
  replicas: 1
  selector:
    matchLabels: {app: notify-svc}
  template:
    metadata:
      labels: {app: notify-svc}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep","3600"]
        env:
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: notify-config
              key: smtp_host
---
# 4. Pending — unschedulable, requests more memory than the node has
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-batch
  namespace: dokops-chaos
spec:
  replicas: 1
  selector:
    matchLabels: {app: analytics-batch}
  template:
    metadata:
      labels: {app: analytics-batch}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep","3600"]
        resources:
          requests:
            memory: "900Gi"
            cpu: "200"
---
# 5. OOMKilled — 8Mi limit, allocates ~64MB
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-warmer
  namespace: dokops-chaos
spec:
  replicas: 1
  selector:
    matchLabels: {app: cache-warmer}
  template:
    metadata:
      labels: {app: cache-warmer}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["/bin/sh","-c"]
        args: ["dd if=/dev/zero of=/dev/shm/fill bs=1M count=64; sleep 3600"]
        resources:
          limits:
            memory: "8Mi"
---
# 6. Silent failure — Service selector typo, healthy pods but zero endpoints
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: dokops-chaos
spec:
  replicas: 2
  selector:
    matchLabels: {app: web-frontend}
  template:
    metadata:
      labels: {app: web-frontend}
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: dokops-chaos
spec:
  selector:
    app: web-fronted   # typo: "fronted" — matches nothing
  ports:
  - port: 80
    targetPort: 80
