# Scenario 06 — PVC never binds (StorageClass does not exist), pod stuck Pending.
# Pass = traces Pending → unbound PVC → missing StorageClass "does-not-exist".
# Partial = "pod Pending" without the storage chain.
apiVersion: v1
kind: Namespace
metadata:
  name: dokops-chaos
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reports-data
  namespace: dokops-chaos
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: does-not-exist
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-db
  namespace: dokops-chaos
spec:
  replicas: 1
  selector:
    matchLabels: {app: reports-db}
  template:
    metadata:
      labels: {app: reports-db}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep","3600"]
        volumeMounts: [{name: data, mountPath: /data}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: reports-data}
