server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker's embedded DNS. Combined with a variable in proxy_pass below, this makes
    # nginx re-resolve the `backend` hostname per request instead of caching the IP at
    # startup — so restarting the backend container (new Docker IP) doesn't leave nginx
    # pointing at a dead upstream (which manifested as minions going offline / 404).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8000";

    # SPA Routing (History API Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Minion WebSocket — must upgrade the connection and hold it open. Without the
    # Upgrade/Connection headers nginx forwards a plain HTTP GET to a websocket-only
    # route -> FastAPI 404; without the long timeouts nginx drops the idle tunnel at
    # its default 60s. More specific than /api/, so it matches first.
    location /api/v1/minions/ws/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy API requests to Backend Service
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (blueprint run logs, AI chat, topology, workflows) must not be buffered:
        # with buffering on, nginx holds events until the response ends and the whole
        # log lands at once instead of streaming live. proxy_http_version defaults to
        # 1.0, which has no chunked encoding — SSE needs 1.1 with keepalive to the
        # upstream, so set both or the events still arrive in one lump.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        # FastAPI trailing-slash 307s return an absolute Location built from the
        # upstream host/scheme, which escapes this origin (wrong port/scheme) and
        # drops the httpOnly auth cookie -> 401 -> logout. Rewrite any absolute
        # backend Location back to a relative path so the browser stays same-origin.
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
